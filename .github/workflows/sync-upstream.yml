name: Sync upstream AriaNg

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    outputs:
      needs_sync: ${{ steps.compare.outputs.needs_sync }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check upstream status
        id: compare
        run: |
          git remote add upstream https://github.com/mayswind/AriaNg.git
          git fetch upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Upstream is already included; nothing to sync."
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream has new commits."
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: check
    if: needs.check.outputs.needs_sync == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/mayswind/AriaNg.git
          git fetch upstream master
          git merge --no-edit upstream/master

      - name: Push updates
        run: git push origin HEAD:master
